<!-- The page side of the platform-CSS contract probe: a page TYPE selector that BEATS the probe's `:where(:scope)` host rule and LOSES to its bare `:scope` one (a pseudo-class outweighs a type), and a page class rule that reaches the light-DOM component's internals (the permanent inward-reach difference from a real shadow root). The `<p class="probe-global">` outside the component is the unscoped rule's page-wide proof, the `<p class="tag-led">` outside it shows the tag-led rule stays contained, and `#page-child`, absent from the template, is a page-authored child the component's own rules style. -->
<style>
	css-probe {
		border-top-color: rgb(0, 128, 0);
		outline-color: rgb(0, 0, 255);
	}

	.label {
		letter-spacing: 3px;
	}
</style>

<css-probe id="probe">
	<p class="label">Label</p>
	<p class="probe-global">Global</p>
	<p class="tag-led">Tag-led</p>
	<basic-button id="child">
		<button type="button" class="secondary medium">
			<span class="label">Child button</span>
			<span class="badge"></span>
		</button>
		<span>Page content</span>
	</basic-button>
	<button type="button" class="own">Own</button>
	<css-probe-child class="variant">
		<pre><code data-children="css-probe"><span class="x">Kid</span><x-kid-widget><button type="button"><span>Kid button</span></button></x-kid-widget></code></pre>
		<span class="x">Child internal</span>
	</css-probe-child>
	<p class="label" id="page-child">Page child</p>
</css-probe>

<p class="probe-global" id="outside-global">Global, outside the component</p>
<p class="tag-led" id="outside-tag-led">Tag-led, outside the component</p>

<css-probe-child id="page-probe-child" class="variant">
	<pre><code><span class="x" id="page-kid">Page kid</span></code></pre>
	<span class="x">Child internal</span>
</css-probe-child>
