<!-- Typed byline props: the page renderer expands each occurrence with the component's server render at build time; an occurrence without a `lang` stays unrendered. -->
<basic-blogmeta
	lang="en"
	author="Esther Brunner"
	avatar="./assets/img/avatar/esther-brunner.jpg"
	published="2026-03-09"
	reading-time="5"
></basic-blogmeta>

<br>

<basic-blogmeta
	lang="en"
	author="Esther Brunner"
	avatar="./assets/img/avatar/esther-brunner.jpg"
	published="2026-04-04"
	modified="2026-04-08"
	reading-time="7"
></basic-blogmeta>

<br>

<!-- Without an avatar: the placeholder avatar renders instead. -->
<basic-blogmeta lang="en" author="Anonymous" published="2026-05-01"></basic-blogmeta>
